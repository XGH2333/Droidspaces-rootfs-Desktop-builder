name: 编译并发布 Droidspaces RootFS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 选择要构建的发行版
        required: true
        type: choice
        default: Debian-13
        options:
          - Debian-13
          - Ubuntu-24
          - Ubuntu-25
          - Ubuntu-26
          - Fedora-43
          - Fedora-44
          - Arch
          - all
          - all-wayland
      custom_username:
        description: 自定义用户名
        required: false
        type: string
        default: Gold
      desktop:
        description: 桌面选择
        required: true
        type: choice
        default: KDE
        options:
          - none
          - KDE
          - KDE mobile
          - GNOME
          - Anland Next
          - Niri
          - Hyprland
          - Mango
          - Denial
      desktop_autostart:
        description: 桌面开机自启动
        required: true
        type: boolean
        default: true
      display_backend:
        description: 显示后端（KDE mobile/GNOME/Anland Next/Niri/Hyprland/Mango/Denial 固定使用 Anland Wayland）
        required: true
        type: choice
        default: anland-wayland
        options:
          - x11
          - anland-wayland
      PulseAudio:
        description: PulseAudio 音频转发
        required: true
        type: choice
        default: socket
        options:
          - socket
          - tcp
          - none
      enable_zh_tz:
        description: 使用中文并设置上海时区
        required: true
        type: boolean
        default: true
      enable_mesa:
        description: 开启高通骁龙 GPU 支持
        required: true
        type: boolean
        default: true
      enable_8gen2_wayland:
        description: 修复骁龙 8 Gen 2 Wayland 花屏
        required: true
        type: boolean
        default: false
      enable_o3_mali:
        description: 玄戒 O3/Mali GPU 支持（mesa-manet，与高通 Mesa 互斥，仅 Debian 13/Ubuntu 24-26）
        required: true
        type: boolean
        default: false
      o3_mesa_version:
        description: manet 版本（pinned=固定 v1.0，latest=最新 release）
        required: true
        type: choice
        default: pinned
        options:
          - pinned
          - latest
      o3_verify_sha256:
        description: 校验 manet 包 SHA256（latest 模式从 release 的 SHA256SUMS 读取）
        required: true
        type: boolean
        default: true
      enable_sshd:
        description: 启用 sshd 并允许密码登录
        required: true
        type: boolean
        default: false
      ssh_public_key:
        description: SSH 公钥（可选，逗号分隔多个；填写后自动启用 sshd）
        required: false
        type: string
        default: '' 
      nosnap:
        description: 移除 Ubuntu Snap
        required: true
        type: boolean
        default: true
      enable_systemd257:
        description: 使用 systemd 257 包族（仅支持 none 和普通 KDE）
        required: true
        type: boolean
        default: false
      enable_srf:
        description: 开启 fcitx5 输入法
        required: true
        type: boolean
        default: true
      enable_binfmt:
        description: 开启跨架构支持
        required: true
        type: boolean
        default: false
      enable_yj:
        description: 开启 NAT 和硬件识别
        required: true
        type: boolean
        default: true
      enable_kfgj:
        description: 安装开发工具
        required: true
        type: boolean
        default: false
      enable_zip:
        description: 安装压缩工具
        required: true
        type: boolean
        default: true
      enable_docker:
        description: 安装 Docker
        required: true
        type: boolean
        default: false
      wayland_package_repository:
        description: Wayland 软件包仓库（公开的 owner/repository）
        required: true
        type: string
        default: Goldzxcbug/droidspaces-package

permissions:
  contents: write

jobs:
  build:
    name: 构建
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: ${{ inputs.build_target }}
      custom_username: ${{ inputs.custom_username }}
      desktop: ${{ inputs.desktop }}
      desktop_autostart: ${{ inputs.desktop_autostart }}
      display_backend: ${{ inputs.display_backend }}
      PulseAudio: ${{ inputs.PulseAudio }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      enable_8gen2_wayland: ${{ inputs.enable_8gen2_wayland }}
      enable_o3_mali: ${{ inputs.enable_o3_mali }}
      o3_mesa_version: ${{ inputs.o3_mesa_version }}
      o3_verify_sha256: ${{ inputs.o3_verify_sha256 }}
      enable_sshd: ${{ inputs.enable_sshd }}
      ssh_public_key: ${{ inputs.ssh_public_key }}
      nosnap: ${{ inputs.nosnap }}
      enable_systemd257: ${{ inputs.enable_systemd257 }}
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: ${{ inputs.enable_binfmt }}
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: ${{ inputs.enable_zip }}
      enable_docker: ${{ inputs.enable_docker }}
      wayland_package_repository: ${{ inputs.wayland_package_repository }}
